<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06331e" />
  <title>Hand Over Foot</title>
  <meta name="description" content="Hand Over Foot, a polished browser card game inspired by Hand and Foot Canasta." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Playfair+Display:ital,wght@1,800&family=Bree+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.9.4" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-header-left">
        <button id="menuToggle" class="hamburger" type="button" aria-label="Open menu">☰</button>
        <a class="app-wordmark" id="homeWordmark" href="#"><b>HAND</b><i>over</i><b>FOOT</b></a>
        <nav id="menuPanel" class="menu-panel hidden" aria-label="Main menu">
          <button id="menuRules" type="button">How to Play</button>
          <button id="menuSettings" type="button">Settings</button>
          <button id="menuScores" type="button">Scores</button>
<button id="menuAbout" type="button">About Developer</button>
        </nav>
      </div>

      <div class="app-header-center">
        <div id="roundBadge" class="round-badge">Hand 1 · Meld 50</div>
        <button id="rulesIndicator" class="rules-indicator" type="button" title="View active rules">Standard Rules</button>
        <div class="zoom-controls" aria-label="Card zoom controls">
          <button id="zoomOutBtn" type="button" title="Zoom cards out">−</button>
          <span id="zoomLevel">100%</span>
          <button id="zoomInBtn" type="button" title="Zoom cards in">+</button>
        </div>
      </div>

      <div class="app-header-right">
        <div id="scoreBadges" class="score-badges header-score-badges"></div>
        <button id="fullscreenBtn" class="fullscreen-btn" type="button" aria-label="Toggle full screen">⛶</button>
      </div>
    </header>
<section id="home" class="view home-view">
      <img class="side-badge hand-badge" src="assets/hand-badge.png" alt="Hand badge" />
      <img class="side-badge foot-badge" src="assets/foot-badge.png" alt="Foot badge" />
      <main class="home-stack">
        <img class="hero-logo" src="assets/hof-logo.png?v=3.4.0" alt="Hand Over Foot logo" />
        <div class="home-buttons single-player-menu" aria-label="Main menu">
          <button class="home-btn green" id="playAiBtn"><span>▶</span>Play</button>
          <button class="home-btn blue" id="rulesBtn"><span>📘</span>How to Play</button>
          <button class="home-btn purple" id="scoresBtn"><span>🏆</span>Scores</button>
        </div>
      </main>
    </section>

    <section id="setup" class="view panel-view hidden">
      <div class="glass-panel narrow">
        <button class="back-btn" data-nav="home">← Home</button>
        <h1 id="setupTitle">Play</h1>
        <p id="setupIntro">Choose a robot difficulty level, then deal the cards.</p>
        <h2 class="setup-section-title">Difficulty</h2>
        <div class="choice-grid">
          <label class="choice"><input type="radio" name="ai" value="easy"><span>😊</span><b>Easy</b><small>Relaxed play</small></label>
          <label class="choice checked"><input type="radio" name="ai" value="club" checked><span>🃏</span><b>Club</b><small>Balanced play</small></label>
          <label class="choice"><input type="radio" name="ai" value="shark"><span>🦈</span><b>Shark</b><small>Strategic play</small></label>
        </div>

        <h2 class="setup-section-title">Game Style</h2>
        <div class="style-choice-grid">
          <label class="style-choice checked">
            <input type="radio" name="gameStyle" value="standard" checked>
            <span><b>Standard</b><small>Recommended · The familiar app rules</small></span>
          </label>
          <label class="style-choice">
            <input type="radio" name="gameStyle" value="kentucky">
            <span><b>Kentucky</b><small>13-card Hand & Foot · regional rules</small></span>
          </label>
        </div>

        <details class="house-options">
          <summary>Simple Options</summary>
          <label class="option-line" id="allowBookAddsRow"><input type="checkbox" id="allowBookAdds" checked> Allow cards to be added to completed books</label>
          <label class="option-line" id="confirmGoOutRow"><input type="checkbox" id="confirmGoOut" checked> Confirm before going out</label>
          <label class="option-line"><input type="checkbox" id="setupLearning"> Learning Help</label>
        </details>

        <button class="primary" id="dealBtn" type="button">Deal Cards</button>
      </div>
    </section>

    <section id="game" class="view game-view hidden">
<main class="table">
        <section class="opponents" id="opponentStrip"></section>

        <section class="team-board">
          <article class="team-panel enemy">
            <h2>Opponents' Melds</h2>
            <div id="team1Melds" class="meld-zone"></div>
          </article>

          <section class="center-piles">
            <div class="pile-wrap">
              <button id="drawBtn" class="pile stock-pile"><span>◆</span><small id="stockCount">0</small></button>
              <em>Draw 2</em>
            </div>
            <div class="pile-wrap">
              <button id="discardPileBtn" class="pile discard-pile"></button>
              <em id="takePileLabel">Take 7</em>
            </div>
            <div class="turn-box">
              <strong id="turnName">Your Turn</strong>
              <p id="message">Draw two cards or take the discard pile.</p>
              <div id="openingProgress" class="opening-progress"></div>
              <p id="learningCoach" class="turn-hint hidden"></p>
            </div>
          </section>

          <article class="team-panel friendly">
            <h2>Your Team Melds</h2>
            <div id="team0Melds" class="meld-zone"></div>
          </article>
        </section>

        <section class="player-area">
          <div class="player-head">
            <div>
              <strong id="playerLabel">You</strong>
              <span id="handMode" class="sr-only">Hand</span>
              <div id="playerJourney" class="pile-journey" aria-label="Your Hand and Foot status"></div>
            </div>
            <div class="cards-left" id="cardsLeft">0 cards</div>
          </div>
          <div id="humanCards" class="hand-row"></div>
        </section>
      </main>

      <footer class="game-actions">
        <button id="drawActionBtn" class="draw-action">Draw 2</button>
        <button id="takeActionBtn" class="take-action">Take 7</button>
        <button id="setBtn">Set</button>
        <button id="addBtn">Add</button>
        <button id="discardBtn" class="danger">Discard</button>
        <button id="goOutBtn" class="gold">Go Out</button>
        <button id="sortBtn">Sort</button>
        <button id="clearBtn">Clear</button>
        <button id="helpBtn" class="blue">Help</button>
        <button id="nextHandBtn" class="hidden">Next Hand</button>
      </footer>
    </section>
  </div>

  <footer class="app-credit-footer" aria-label="Application credit">
    <span class="credit-brand">ARTEZIQ</span>
    <span class="credit-dot">•</span>
    <span>Hand Over Foot</span>
    <span class="credit-dot">•</span>
    <span>v3.9.4</span>
  </footer>

  <dialog id="modal" class="modal">
    <button id="closeModal" class="modal-close">×</button>
    <div id="modalBody"></div>
  </dialog>

  <script src="game.js?v=3.9.4"></script>
</body>
</html>
